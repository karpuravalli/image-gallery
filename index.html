<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision | Premium Image Gallery</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feather Icons for UI elements -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <header>
    <h1>Vision Gallery</h1>
    <p class="subtitle">Explore a curated collection of stunning moments</p>
    
    <div class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="nature">Nature</button>
      <button class="filter-btn" data-category="architecture">Architecture</button>
      <button class="filter-btn" data-category="animals">Animals</button>
    </div>
  </header>

  <main class="gallery-container">
    <div class="gallery" id="gallery">
      <!-- Gallery items will be generated by JS -->
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightbox-close">
      <i data-feather="x"></i>
    </div>
    
    <div class="lightbox-prev" id="lightbox-prev">
      <i data-feather="chevron-left"></i>
    </div>
    
    <div class="lightbox-content">
      <img src="" alt="Enlarged view" class="lightbox-img" id="lightbox-img">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
    
    <div class="lightbox-next" id="lightbox-next">
      <i data-feather="chevron-right"></i>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    feather.replace();
  </script>
</body>
</html>
